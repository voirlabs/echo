packages:
  - 'apps/*'

# Dependencies allowed to run install scripts (Prisma's engines, Tailwind's oxide).
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - '@tailwindcss/oxide'

# Patched versions of transitive dependencies (pnpm audit --prod), within the ranges
# their parents accept or one minor past a pinned version.
overrides:
  '@hono/node-server': '^2.1.11'
  'body-parser': '^2.4.0'
  'browserslist': '^4.28.7'
  'baseline-browser-mapping': '^2.11.0'
  'effect': '^3.22.5'
  'express': '^5.3.0'
  'fast-uri': '^3.1.9'
  'hono': '^4.13.16'
  'ip-address': '^10.7.4'
  'proxy-addr': '^2.0.8'
  'qs': '^6.16.1'

# Install only versions published at least 3 days ago (matches Dependabot, and keeps
# brand-new and possibly compromised releases out of the lockfile).
minimumReleaseAge: 4320
